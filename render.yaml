services:
  - type: web
    name: xadrez-entre-amigos
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: '1'
      - key: DATABASE_URL
        fromDatabase:
          name: xadrez-entre-amigos-db
          property: connectionString
databases:
  - name: xadrez-entre-amigos-db
    plan: free
